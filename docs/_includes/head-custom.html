<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  // Kramdown/Rouge emits <div class="language-mermaid ..."><div class="highlight"><pre><code>;
  // some builders emit <pre><code class="language-mermaid">. Handle both.
  document.addEventListener("DOMContentLoaded", async () => {
    const blocks = document.querySelectorAll(
      "div.language-mermaid, pre > code.language-mermaid, code.language-mermaid"
    );
    const seen = new Set();
    blocks.forEach((el) => {
      const target = el.tagName === "DIV" ? el : (el.closest("pre") || el);
      if (seen.has(target)) return;
      seen.add(target);
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = el.textContent;
      target.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: ".mermaid" });
  });
</script>
